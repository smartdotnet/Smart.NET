name: Release preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Smart.NET.sln
      - run: dotnet test Smart.NET.sln --configuration Release --no-restore
      - run: dotnet pack src/Smart.NET.Abstractions/Smart.NET.Abstractions.csproj --configuration Release --no-restore --output artifacts
      - run: dotnet pack src/Smart.NET/Smart.NET.csproj --configuration Release --no-restore --output artifacts
      - run: dotnet pack src/Smart.NET.Jev/Smart.NET.Jev.csproj --configuration Release --no-restore --output artifacts
      - name: Verify package contents
        shell: bash
        run: |
          for package in artifacts/*.nupkg; do
            unzip -l "$package" | grep -q 'README.md'
            unzip -l "$package" | grep -q 'LICENSE'
            unzip -l "$package" | grep -q 'lib/net10.0/.*\.dll'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-packages
          path: artifacts/*.nupkg
